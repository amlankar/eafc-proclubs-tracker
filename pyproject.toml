[project]
name = "eafc-proclubs-tracker"
version = "0.1.0"
description = "Local EA FC Clubs match archive and read-only dashboard"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff==0.14.0", "playwright==1.56.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
